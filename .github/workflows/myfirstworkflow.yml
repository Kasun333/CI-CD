name: myfirstworkflow

on:
  push:

env:
  APP_NAME: MyGitHubApp
  ENVIRONMENT: DEV
  VERSION: 1.0.0

jobs:
  upload-directory-artifact:
    name: Upload Directory Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Use environment variables
        run: |
          echo "Application Name: ${{ env.APP_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Version: ${{ env.VERSION }}"

      - name: Use GitHub Secret
        run: |
          echo "Password: ${{ secrets.APP_PASSWORD }}"

      - name: Create artifact directory
        run: |
          mkdir my-artifact-dir
          echo "First file" > my-artifact-dir/file1.txt
          echo "Second file" > my-artifact-dir/file2.txt
          echo "Secret file" > my-artifact-dir/secret.txt
          echo "Log file" > my-artifact-dir/debug.log

      - name: Upload full directory
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-directory-artifact
          path: my-artifact-dir/

  upload-directory-excluding-files:
    name: Upload Directory Excluding Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Create artifact directory
        run: |
          mkdir my-artifact-dir
          echo "First file" > my-artifact-dir/file1.txt
          echo "Second file" > my-artifact-dir/file2.txt
          echo "Secret file" > my-artifact-dir/secret.txt
          echo "Log file" > my-artifact-dir/debug.log

      - name: Upload directory excluding some files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: filtered-directory-artifact
          path: |
            my-artifact-dir/
            !my-artifact-dir/secret.txt
            !my-artifact-dir/*.log
  show-trigger-info:
    name: Show Trigger Information
    runs-on: ubuntu-latest

    steps:
      - name: Display event details
        run: |
          echo "Workflow triggered by: ${{ github.actor }}"
          echo "Event name: ${{ github.event_name }}"

  staging-info:
    name: STAGING Environment Details
    runs-on: ubuntu-latest
    environment: STAGING
    if: github.head_ref =='dev'

    steps:
      - name: Print STAGING variables and secret
        run: |
          echo "Environment: STAGING"
          echo "App Name: ${{ vars.APP_NAME }}"
          echo "App Version: ${{ vars.APP_VERSION }}"
          echo "Password: ${{ secrets.PASSWORD }}"
        

  production-info:
    name: PRODUCTION Environment Details
    runs-on: ubuntu-latest
    environment: PRODUCTION
    if: github.head_ref =='main'

    steps:
      - name: Print PRODUCTION variables and secret
        run: |
          echo "Environment: PRODUCTION"
          echo "App Name: ${{ vars.APP_NAME }}"
          echo "App Version: ${{ vars.APP_VERSION }}"
          echo "Password: ${{ secrets.PASSWORD }}"

  debug-refs:
    name: Debug GitHub Refs
    runs-on: ubuntu-latest

    steps:
    - name: Print GitHub context values
      run: |
        echo "github.ref = ${{ github.ref }}"
        echo "github.head_ref = ${{ github.head_ref }}"
        echo "github.base_ref = ${{ github.base_ref }}"
        echo "github.ref_name = ${{ github.ref_name }}"
        echo "github.actor = ${{ github.actor }}"
        echo "github.event_name = ${{ github.event_name }}"
        
