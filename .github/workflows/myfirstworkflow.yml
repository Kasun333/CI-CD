name: Reusable Python CI/CD Pipeline

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  run-tests:
    name: Run Python Test Cases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests with unit test and coverage reports
        run: |
          pytest \
            --junitxml=reports/unit-test-report.xml \
            --html=reports/unit-test-report.html \
            --self-contained-html \
            --cov=. \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html

      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: python-test-coverage-reports
          path: reports/

  codeql-security-scan:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sonarcloud-code-quality:
    name: SonarCloud Code Quality Check
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download test and coverage reports
        uses: actions/download-artifact@v4
        with:
          name: python-test-coverage-reports
          path: reports/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Sonar Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Build and Save Docker Image
    runs-on: ubuntu-latest
    needs:
      - run-tests
      - codeql-security-scan
      - sonarcloud-code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t flask-app:${{ github.sha }} \
            -t flask-app:${{ github.run_id }} \
            -t flask-app:latest \
            .

      - name: Save Docker image
        run: |
          docker save \
            flask-app:${{ github.sha }} \
            flask-app:${{ github.run_id }} \
            flask-app:latest \
            -o flask-app.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: flask-app.tar

  dockerhub-push:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i flask-app.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        run: |
          docker tag flask-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/your-repository-name:${{ github.sha }}
          docker tag flask-app:${{ github.run_id }} ${{ secrets.DOCKERHUB_USERNAME }}/your-repository-name:${{ github.run_id }}
          docker tag flask-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/your-repository-name:latest

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-repository-name:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-repository-name:${{ github.run_id }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-repository-name:latest