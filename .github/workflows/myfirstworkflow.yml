name: Python CI/CD

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  python-ci:
    uses: Kasun333/CI-CD/.github/workflows/myfirstworkflow.yml@temp
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}